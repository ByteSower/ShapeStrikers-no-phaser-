name: Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: node --test --test-concurrency=1 tests/**/*.test.js
      - name: Check determinism
        run: node scripts/checkDeterminism.js
